<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>学习任务板 · Dream Maker Demo</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="eyebrow">DREAM MAKER / DEMO PROJECT</span><h1>把今天的目标<br>变成完成的事情。</h1><p>学习任务板 · 数据只保存在当前浏览器</p></header><section><div id="add-form" role="group" aria-label="添加学习任务"><label for="title">下一件想完成的事</label><div class="row"><input id="title" name="title" maxlength="120" placeholder="例如：独立复现一个 Agent 工具调用" required><button id="add-task" type="button">添加任务</button></div></div><p id="error" role="alert"></p><div class="toolbar"><strong id="stats"></strong><select id="filter" aria-label="筛选任务"><option value="all">全部</option><option value="active">未完成</option><option value="done">已完成</option></select></div><ul id="tasks"></ul><p id="empty">从一件小事开始。</p></section><footer>这是固定演示样例，不是 Live Agent 自动创作的证明。浏览器清理站点数据会移除任务。</footer></main><script type="module" src="app.mjs"></script></body></html>
